<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0, viewport-fit=cover">

    <title>いきものマスター</title>

    <meta name="theme-color" content="#1f7a3d">

    <link rel="manifest" href="manifest.json">
    <link rel="icon" href="assets/icon/icon-192.png">

    <link rel="stylesheet" href="styles.css">
</head>

<body>

<div id="app">

    <!-- 上部 -->
    <header id="topBar">
        <h1>いきものマスター</h1>

        <div id="playerInfo">
            <span id="discoverCount">発見 0</span>
            <span id="cardCount">カード 0</span>
        </div>
    </header>

    <!-- メイン画面 -->
    <main id="screen"></main>

    <!-- 下メニュー -->
    <nav id="bottomNav">

        <button data-screen="home">
            🏠<br>ホーム
        </button>

        <button data-screen="camera">
            📷<br>AI判定
        </button>

        <button data-screen="catalog">
            📖<br>図鑑
        </button>

        <button data-screen="cards">
            🃏<br>カード
        </button>

        <button data-screen="spirit">
            ✨<br>精霊
        </button>

    </nav>

</div>

<!-- 共通 -->
<script type="module" src="app.js"></script>

</body>
</html>
