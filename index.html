<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    >

    <title>いきものマスター</title>

    <meta name="theme-color" content="#173f2b">

    <link rel="manifest" href="./manifest.webmanifest">
    <link rel="icon" href="./icon-192.png">
    <link rel="apple-touch-icon" href="./icon-192.png">

    <link rel="stylesheet" href="./styles.css">
    <link rel="stylesheet" href="./styles/camera.css">
    <link rel="stylesheet" href="./styles/cards.css">
</head>

<body>

<div id="app">

    <header id="topBar">

        <h1>いきものマスター</h1>

        <div id="playerInfo">
            <span id="discoverCount">発見 0</span>
        </div>

    </header>

    <main id="screen"></main>

    <nav id="bottomNav" aria-label="メインメニュー">

        <button
            type="button"
            data-screen="home"
            aria-label="ホーム"
        >
            <svg
                viewBox="0 0 24 24"
                aria-hidden="true"
            >
                <path
                    d="M3 11.5 12 4l9 7.5V21h-6v-6H9v6H3z"
                />
            </svg>

            <span>ホーム</span>
        </button>

        <button
            type="button"
            data-screen="camera"
            aria-label="AI判定"
        >
            <svg
                viewBox="0 0 24 24"
                aria-hidden="true"
            >
                <path
                    d="M9 5l1.4-2h3.2L15 5h4a2 2 0 0 1 2 2v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V7a2 2 0 0 1 2-2z"
                />
                <circle cx="12" cy="12.5" r="4" />
            </svg>

           <span>🌿 仲間をさがす</span>
        </button>

        <button
            type="button"
            data-screen="catalog"
            aria-label="図鑑"
        >
            <svg
                viewBox="0 0 24 24"
                aria-hidden="true"
            >
                <path
                    d="M4 4.5A3.5 3.5 0 0 1 7.5 1H11v18H7.5A3.5 3.5 0 0 0 4 22z"
                />
                <path
                    d="M20 4.5A3.5 3.5 0 0 0 16.5 1H13v18h3.5A3.5 3.5 0 0 1 20 22z"
                />
            </svg>

            <span>図鑑</span>
        </button>

        <button
            type="button"
            data-screen="spirit"
            aria-label="精霊"
        >
            <svg
                viewBox="0 0 24 24"
                aria-hidden="true"
            >
                <path
                    d="M12 2c1.4 3.3 3.2 5.1 6.5 6.5C15.2 9.9 13.4 11.7 12 15c-1.4-3.3-3.2-5.1-6.5-6.5C8.8 7.1 10.6 5.3 12 2z"
                />
                <path
                    d="M18.5 14c.7 1.8 1.7 2.8 3.5 3.5-1.8.7-2.8 1.7-3.5 3.5-.7-1.8-1.7-2.8-3.5-3.5 1.8-.7 2.8-1.7 3.5-3.5z"
                />
            </svg>

            <span>精霊</span>
        </button>

    </nav>

</div>

<script src="./data.js"></script>
<script type="module" src="./app.js"></script>
</body>
</html>
