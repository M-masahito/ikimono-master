<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    >

    <title>いきものマスター</title>

    <!-- iPhone / PWA -->
    <meta name="theme-color" content="#173f2b">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta
        name="apple-mobile-web-app-status-bar-style"
        content="black-translucent"
    >
    <meta
        name="apple-mobile-web-app-title"
        content="いきものマスター"
    >

    <link rel="manifest" href="./manifest.webmanifest">

    <link
        rel="icon"
        type="image/png"
        href="./icon-192.png"
    >

    <link
        rel="apple-touch-icon"
        href="./icon-192.png"
    >

    <!-- CSS -->
    <link rel="stylesheet" href="./styles.css">
    <link rel="stylesheet" href="./styles/camera.css">
    <link rel="stylesheet" href="./styles/cards.css">
</head>

<body>

    <div id="app">

        <!-- 上部 -->
        <header id="topBar">

            <h1>いきものマスター</h1>

            <div id="playerInfo">
                <span id="discoverCount">
                    発見 0
                </span>
            </div>

        </header>


        <!-- 各画面の表示場所 -->
        <main id="screen"></main>


        <!-- 下メニュー -->
        <nav
            id="bottomNav"
            aria-label="メインメニュー"
        >

            <button
                type="button"
                data-screen="home"
                aria-label="ホーム"
            >
<img
    class="nav-game-icon nav-home-icon"
    src="./assets/ui/nav/nav_home.png"
    alt=""
    aria-hidden="true"
>
                <span>ホーム</span>
            </button>

            <button
                type="button"
                data-screen="camera"
                aria-label="仲間をさがす"
            >
<img
    class="nav-game-icon nav-camera-icon"
    src="./assets/ui/nav/nav_camera.png"
    alt=""
    aria-hidden="true"
>
                <span>仲間をさがす</span>
            </button>

            <button
                type="button"
                data-screen="catalog"
                aria-label="図鑑"
            >
<img
    class="nav-game-icon nav-catalog-icon"
    src="./assets/ui/nav/nav_catalog.png"
    alt=""
    aria-hidden="true"
>
                <span>図鑑</span>
            </button>

            <button
                type="button"
                data-screen="spirit"
                aria-label="精霊"
            >
                <span
                    class="nav-game-icon nav-spirit-icon"
                    aria-hidden="true"
                >
                    🥚
                </span>

                <span>精霊</span>
            </button>

        </nav>
    </div>


    <!-- データ -->
    <script src="./data.js"></script>

    <!-- アプリ本体 -->
    <script
        type="module"
        src="./app.js"
    ></script>


    <!--
        Service Worker
        ホーム画面版でも起動時に最新版を確認
    -->
    <script>
        if ("serviceWorker" in navigator) {

            window.addEventListener("load", async () => {

                try {

                    const registration =
                        await navigator.serviceWorker.register(
                            "./sw.js"
                        );

                    // 起動時に新しいService Workerを確認
                    await registration.update();

                    // 新版へ切り替わったら1度だけ再読み込み
                    let reloading = false;

                    navigator.serviceWorker.addEventListener(
                        "controllerchange",
                        () => {

                            if (reloading) {
                                return;
                            }

                            reloading = true;

                            window.location.reload();
                        }
                    );

                } catch (error) {

                    console.error(
                        "Service Worker登録エラー:",
                        error
                    );
                }
            });
        }
    </script>

</body>
</html>
