<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>いきものマスター</title>

  <link rel="stylesheet" href="styles.css">
    <!-- HEIC対応 -->
    <script src="https://cdn.jsdelivr.net/npm/heic2any/dist/heic2any.min.js"></script>
</head>
<body>

<header class="header">
    <h1>いきものマスター</h1>
</header>

<nav class="menu">
    <button onclick="showScreen('home')">🏠 ホーム</button>
    <button onclick="showScreen('camera')">📸 AI判定</button>
    <button onclick="showScreen('catalog')">📖 図鑑</button>
    <button onclick="showScreen('spirit')">👤 精霊</button>
</nav>

<main>

    <!-- ホーム -->
    <section id="home" class="screen">

        <div class="spirit-card">

            <img id="homeSpiritImage"
                 src="assets/icons/egg.png"
                 alt="精霊">

            <h2 id="homeSpiritName">？？？</h2>

            <p id="homeSpiritTitle">たまご</p>

        </div>

        <div class="progress">
            発見数
            <span id="discoveryCount">0</span>
            / 500
        </div>

    </section>

    <!-- AI判定 -->
    <section id="camera" class="screen" style="display:none;">

        <input
            type="file"
            id="photo"
            accept="image/*,.heic,.HEIC">

        <div id="preview">
            写真を選択してください
        </div>

        <button id="identify">
            AI判定する
        </button>

        <p id="aiStatus">
            写真を選択してください
        </p>

    </section>

    <!-- 図鑑 -->
    <section id="catalog" class="screen" style="display:none;">

        <div id="catalogGrid">

        </div>

    </section>

    <!-- 精霊 -->
    <section id="spirit" class="screen" style="display:none;">

        <div id="spiritInfo">

        </div>

    </section>

</main>

<script src="config.js"></script>

<script src="insects.js"></script>
<script src="fish.js"></script>
<script src="birds.js"></script>
<script src="reptiles.js"></script>
<script src="mammals.js"></script>
<script src="plants.js"></script>
<script src="mushrooms.js"></script>
<script src="special.js"></script>

<script src="data.js"></script>
<script src="spirit.js"></script>
<script src="catalog.js"></script>
<script src="ai.js"></script>
<script src="app.js"></script>
</body>
</html>
